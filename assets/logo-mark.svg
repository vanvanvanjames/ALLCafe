<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ALL Cafe enamel mug mark">
  <title>ALL Cafe — the enamel tasa</title>
  <g fill="none" stroke="#1C3A5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- handle -->
    <path d="M46.5 30.5C54.5 30.5 58.5 34 58.5 38.5S54.5 46.5 47.5 46.5"/>
    <!-- body, tapering the way a tin tasa does -->
    <path d="M13.5 25 16 49c.4 4.5 3.5 7 8 7h12c4.5 0 7.6-2.5 8-7l2.5-24"/>
  </g>
  <!-- the flared enamel rim, the one detail that survives at 16px -->
  <rect x="10" y="14.5" width="40" height="9" rx="4.5" fill="#1C3A5B"/>
</svg>
